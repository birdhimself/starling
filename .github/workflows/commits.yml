name: Commits

# Checks this repository's own commits with its own checker. The workflow
# that consuming repositories install comes later (roadmap step 6).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  commits:
    name: Check commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: .starling/bin/check-commit-msg --range "$RANGE" --reject-merges

      - name: Check pushed commits
        if: github.event_name == 'push'
        env:
          RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: .starling/bin/check-commit-msg --range "$RANGE" --reject-merges --reject-fixups
