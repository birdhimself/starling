schema_version: "1.1"
name: open-pr-default-branch
description: >-
  On the default branch the skill stops and offers a branch instead of pushing.
tags: [open-pr]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Open a pull request for this.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: uses-the-skill
  type: tool_used
  tool: Skill
  input_match: open-pr
- name: never-pushes
  type: tool_used
  tool: Bash
  input_match: 'git push'
  min: 0
  max: 0
- name: never-creates-a-pull-request
  type: tool_used
  tool: Bash
  input_match: 'gh pr create'
  min: 0
  max: 0
- name: offers-a-branch
  type: llm
  focus: trace
  criteria: >-
    Read the agent's last message. PASS if it says the work is on the
    default branch, so no pull request was opened, and offers to create
    a branch or asks for one. FAIL if it says a pull request was opened
    or does not mention the default branch.
