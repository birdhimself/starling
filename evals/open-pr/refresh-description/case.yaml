schema_version: "1.1"
name: open-pr-refresh-description
description: >-
  An open pull request gets a new title and body, and no second pull request.
tags: [open-pr]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    The description of the pull request for this branch no longer matches what the branch does. Please bring it up to date.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: uses-the-skill
  type: tool_used
  tool: Skill
  input_match: open-pr
- name: edits-the-pull-request
  type: tool_used
  tool: Bash
  input_match: 'gh pr edit[^|;&]*--body-file'
- name: never-creates-a-pull-request
  type: tool_used
  tool: Bash
  input_match: 'gh pr create'
  min: 0
  max: 0
- name: never-marks-ready
  type: tool_used
  tool: Bash
  input_match: 'gh pr ready'
  min: 0
  max: 0
- name: never-merges
  type: tool_used
  tool: Bash
  input_match: 'gh pr merge|git merge(?!-)'
  min: 0
  max: 0
