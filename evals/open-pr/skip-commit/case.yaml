schema_version: "1.1"
name: open-pr-skip-commit
description: >-
  Committing without opening a pull request belongs to commit-changes.
tags: [open-pr]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Commit my changes. I'll open the pull request myself later.
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: open-pr
  min: 0
  max: 0
