schema_version: "1.1"
name: open-pr-with-template
description: >-
  A finished branch is checked, and the body follows the repository's template and ticks only what ran.
tags: [open-pr]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    The work on this branch is done. Open a pull request for it.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: uses-the-skill
  type: tool_used
  tool: Skill
  input_match: open-pr
- name: runs-the-tests
  type: tool_used
  tool: Bash
  input_match: 'npm (run )?test|node --test'
- name: checks-the-commits
  type: tool_used
  tool: Bash
  input_match: 'check-commit-msg --range'
- name: pushes-the-branch
  type: tool_used
  tool: Bash
  input_match: 'git push'
- name: creates-a-draft
  type: tool_used
  tool: Bash
  input_match: 'gh pr create[^|;&]*--draft'
- name: never-marks-ready
  type: tool_used
  tool: Bash
  input_match: 'gh pr ready'
  min: 0
  max: 0
- name: never-merges
  type: tool_used
  tool: Bash
  input_match: 'gh pr merge|git merge(?!-)'
  min: 0
  max: 0
- name: title-is-a-plain-sentence
  type: regex
  target: trace
  pattern: '--title (\\"|'')[A-Z]'
- name: no-conventional-prefix-in-the-title
  type: regex
  target: trace
  pattern: '--title (\\"|'')(feat|fix|docs|build)'
  match: not_contains
- name: keeps-the-sections-without-comments
  type: regex
  target: trace
  pattern: '## Changes\\n\\n[^<].{0,2000}## Rollout\\n\\n[^<].{0,800}## Validation\\n\\n- \[x\]'
- name: ticks-the-test-it-ran
  type: regex
  target: trace
  pattern: '- \[x\] .{0,3}npm test'
- name: leaves-the-staging-check-unticked
  type: regex
  target: trace
  pattern: '- \[[xX]\] Checked on a staging'
  match: not_contains
