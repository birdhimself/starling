schema_version: "1.1"
name: open-pr-skip-review-threads
description: >-
  Answering review remarks belongs to resolve-review-threads.
tags: [open-pr]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Address the review comments on pull request #7.
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: open-pr
  min: 0
  max: 0
