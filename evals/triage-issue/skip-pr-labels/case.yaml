schema_version: "1.1"
name: triage-issue-skip-pr-labels
description: >-
  Labeling a pull request is not triaging an issue.
tags: [triage-issue]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Add the bug label to pull request #7.
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: triage-issue
  min: 0
  max: 0
- name: tries-the-label
  type: tool_used
  tool: Bash
  input_match: 'gh (pr edit|api).*7'
