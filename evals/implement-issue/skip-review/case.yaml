schema_version: "1.1"
name: implement-issue-skip-review
description: >-
  Reviewing a pull request is not implementing an issue.
tags: [implement-issue]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Review pull request #7.
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: implement-issue
  min: 0
  max: 0
