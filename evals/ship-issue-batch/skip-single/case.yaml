schema_version: "1.1"
name: ship-issue-batch-skip-single
description: >-
  A single issue is ship-issue's.
tags: [ship-issue-batch]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Ship issue #12.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: ship-issue-batch
  min: 0
  max: 0
