schema_version: "1.1"
name: ship-issue-batch-survey-before-agents
description: >-
  A batch starts with a survey of every issue, without spawning agents or
  writing code before the question round.
tags: [ship-issue-batch]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Ship issues #12 and #13 together.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: uses-the-skill
  type: tool_used
  tool: Skill
  input_match: ship-issue-batch
- name: reads-both-issues
  type: tool_used
  tool: Bash
  input_match: '13'
- name: never-edits
  type: tool_used
  tool: Edit
  min: 0
  max: 0
- name: creates-no-branch
  type: tool_used
  tool: Bash
  input_match: 'git (switch|checkout)\s+(--no-track\s+)?-[cb]|gh stack init'
  min: 0
  max: 0
