schema_version: "1.1"
name: commit-changes-skip-push
description: >-
  Pushing a branch is not a reason to load the skill.
tags: [commit-changes]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Push my branch.
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
  - name: does-not-use-the-skill
    type: tool_used
    tool: Skill
    input_match: commit-changes
    min: 0
    max: 0
  - name: pushes
    type: tool_used
    tool: Bash
    input_match: git\s+push
