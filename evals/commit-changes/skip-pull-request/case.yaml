schema_version: "1.1"
name: commit-changes-skip-pull-request
description: >-
  Opening a pull request is not a reason to load the skill.
tags: [commit-changes]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Open a pull request for this branch.
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
  - name: does-not-use-the-skill
    type: tool_used
    tool: Skill
    input_match: commit-changes
    min: 0
    max: 0
