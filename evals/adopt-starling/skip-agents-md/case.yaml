schema_version: "1.1"
name: adopt-starling-skip-agents-md
description: >-
  Adding a rule to AGENTS.md is not adopting Starling.
tags: [adopt-starling]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Add a rule to AGENTS.md: run npm run lint before every commit.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
  - name: does-not-use-the-skill
    type: tool_used
    tool: Skill
    input_match: adopt-starling
    min: 0
    max: 0
  - name: adds-the-rule
    type: regex
    target: {source: file, path: AGENTS.md}
    pattern: npm run lint
