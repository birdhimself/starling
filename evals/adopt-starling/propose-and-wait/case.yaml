schema_version: "1.1"
name: adopt-starling-propose-and-wait
description: >-
  Asked to fit a repository to a fresh install, the skill surveys it and
  proposes what to replace, keep and move, and changes nothing before
  confirmation.
tags: [adopt-starling]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    We just installed Starling in this repository. Fit our own setup to it.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
  - name: uses-the-skill
    type: tool_used
    tool: Skill
    input_match: adopt-starling
  - name: runs-the-survey
    type: tool_used
    tool: Bash
    input_match: adopt-starling/scripts/survey
  - name: removes-nothing-yet
    type: tool_used
    tool: Bash
    input_match: 'rm\s+(-\S+\s+)*\S*create-pr'
    min: 0
    max: 0
  - name: writes-no-policy-yet
    type: tool_used
    tool: Write
    input_match: '\.agents/policy/'
    min: 0
    max: 0
  - name: edits-nothing-yet
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: git\s+commit
    min: 0
    max: 0
  - name: names-the-policy-file
    type: regex
    pattern: '\.agents/policy/open-pr\.md'
  - name: proposes-and-asks
    type: llm
    focus: trace
    criteria: >-
      Read the agent's last message. PASS if it proposes replacing the
      project's create-pr skill with Starling's open-pr skill, proposes
      keeping the dashboard label and the npm run lint check in a policy
      file for open-pr, says the review-labels skill stays, points out
      that the AGENTS.md rule about chore commits conflicts with
      Starling's commit rules, and asks for confirmation before changing
      anything. FAIL if it leaves out any of these, proposes removing
      review-labels, or reports having already changed files.
