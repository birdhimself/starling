schema_version: "1.1"
name: apply-review-findings-skip-ready
description: >-
  Marking a pull request ready once CI passes is not applying findings.
tags: [apply-review-findings]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Mark pull request #7 ready once its CI passes.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: apply-review-findings
  min: 0
  max: 0
