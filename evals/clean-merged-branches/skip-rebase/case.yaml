schema_version: "1.1"
name: clean-merged-branches-skip-rebase
description: >-
  Rebasing a branch is not cleaning up.
tags: [clean-merged-branches]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Rebase wip-lobby onto main.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: clean-merged-branches
  min: 0
  max: 0
