schema_version: "1.1"
name: refine-draft-issues-skip-implement
description: >-
  Implementing an issue does not load the refine skill.
tags: [refine-draft-issues]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Implement issue #12.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: refine-draft-issues
  min: 0
  max: 0
