schema_version: "1.1"
name: refine-draft-issues-skip-create
description: >-
  Creating a new issue is not refining a draft.
tags: [refine-draft-issues]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Create an issue for the lobby crash when the host leaves.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: refine-draft-issues
  min: 0
  max: 0
