schema_version: "1.1"
name: write-skill-with-eval-setup
description: >-
  In a project with an eval setup, a new skill gets eval cases tagged with
  its name, including one in which it must not run.
tags: [write-skill]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Create a skill for this project that reviews how widget labels are formatted and reports labels that read wrong, such as "1 widgets", without changing any code. Call it review-labels.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
  - name: uses-the-skill
    type: tool_used
    tool: Skill
    input_match: write-skill
  - name: writes-the-skill-in-agents-skills
    type: regex
    target: {source: file, path: .agents/skills/review-labels/SKILL.md}
    pattern: '^name: review-labels$'
    flags: m
  - name: writes-a-case
    type: tool_used
    tool: Write
    input_match: 'evals/review-labels/[^"]*case\.yaml'
  - name: tags-the-cases-with-the-skill
    type: tool_used
    tool: Write
    input_match: 'evals/review-labels/[^"]*case\.yaml.*tags:\s*\[review-labels\]'
  - name: writes-a-must-not-run-case
    type: tool_used
    tool: Write
    input_match: 'evals/review-labels/[^"]*case\.yaml.*max:\s*0'
  - name: runs-no-evals-unasked
    type: tool_used
    tool: Bash
    input_match: plugin\s+eval
    min: 0
    max: 0
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: git\s+commit
    min: 0
    max: 0
