schema_version: "1.1"
name: write-skill-with-eval-setup
description: >-
  In a project with an eval setup, a new skill gets eval cases tagged with
  its name, including one in which it must not run.
tags: [write-skill]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Create a skill for this project that reviews how widget labels are formatted and reports labels that read wrong, such as "1 widgets", without changing any code. Call it review-labels.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
  - name: uses-the-skill
    type: tool_used
    tool: Skill
    input_match: write-skill
  - name: writes-the-skill-in-agents-skills
    type: regex
    target: {source: file, path: .agents/skills/review-labels/SKILL.md}
    pattern: '^name: review-labels$'
    flags: m
  # The cases may be written with Write or from the shell, so these grade
  # the files and the run rather than one tool.
  - name: writes-a-case
    type: file_exists
    path: evals/review-labels/*/case.yaml
  - name: tags-the-cases-with-the-skill
    type: regex
    target: trace
    pattern: 'tags:\s*\[review-labels\]'
  - name: writes-a-must-not-run-case
    type: regex
    target: trace
    pattern: 'input_match:\s*\\?[''"]?review-labels\\?[''"]?(\\n|\s)+(min:\s*0(\\n|\s)+)?max:\s*0'
  - name: runs-no-evals-unasked
    type: tool_used
    tool: Bash
    input_match: plugin\s+eval
    min: 0
    max: 0
  # A case's fixture may commit, so grade the repository's own log: the
  # scaffold leaves only its initial commit there.
  - name: never-commits
    type: regex
    target: {source: file, path: .git/logs/HEAD}
    pattern: '\tcommit( \((amend|merge)\))?: '
    match: not_contains
