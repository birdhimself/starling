schema_version: "1.1"
name: write-skill-skip-agents-md
description: >-
  Adding a rule to AGENTS.md is not writing a skill.
tags: [write-skill]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Add a rule to AGENTS.md: run npm test before every commit.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
  - name: does-not-use-the-skill
    type: tool_used
    tool: Skill
    input_match: write-skill
    min: 0
    max: 0
  - name: adds-the-rule
    type: regex
    target: {source: file, path: AGENTS.md}
    pattern: before (every|each|any) commit|before committing
    flags: i
