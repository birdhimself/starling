schema_version: "1.1"
name: resolve-review-threads-skip-review
description: >-
  Reviewing someone's pull request is not resolving its threads.
tags: [resolve-review-threads]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Review pull request #7.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: resolve-review-threads
  min: 0
  max: 0
