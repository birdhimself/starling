schema_version: "1.1"
name: test-skill-broken-skill
description: >-
  Testing a project skill that breaks three rules reports all three and
  changes nothing.
tags: [test-skill]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Check the review-labels skill.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
  - name: uses-the-skill
    type: tool_used
    tool: Skill
    input_match: test-skill
  - name: runs-the-lint
    type: tool_used
    tool: Bash
    input_match: test-skill/scripts/lint
  - name: never-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: never-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: never-changes-files-from-the-shell
    type: tool_used
    tool: Bash
    input_match: 'sed\s+-i|\bmv\s|\bchmod\s|\brm\s|git\s+(commit|mv|rm)'
    min: 0
    max: 0
  - name: no-evals-without-cases
    type: tool_used
    tool: Bash
    input_match: plugin\s+eval
    min: 0
    max: 0
  - name: reports-the-description
    type: regex
    pattern: Do not use for
  - name: reports-the-repository
    type: regex
    pattern: acme/labels
  - name: reports-the-script
    type: regex
    pattern: count\.sh
