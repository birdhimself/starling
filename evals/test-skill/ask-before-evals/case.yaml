schema_version: "1.1"
name: test-skill-ask-before-evals
description: >-
  A clean skill with an eval case is linted, and the evals wait for the
  user's answer instead of running.
tags: [test-skill]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Test the review-labels skill.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
  - name: uses-the-skill
    type: tool_used
    tool: Skill
    input_match: test-skill
  - name: runs-the-lint
    type: tool_used
    tool: Bash
    input_match: test-skill/scripts/lint
  - name: does-not-run-the-evals-unasked
    type: tool_used
    tool: Bash
    input_match: plugin\s+eval
    min: 0
    max: 0
  - name: never-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: asks-about-the-evals
    type: llm
    focus: trace
    criteria: >-
      Read the agent's last message. PASS if it reports that the
      review-labels skill passed the lint (no findings) and asks the user
      whether to run the skill's eval case or cases, before running them.
      FAIL if it ran the evals, did not ask, or reported lint findings that
      the lint did not print.
