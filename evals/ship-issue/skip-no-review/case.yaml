schema_version: "1.1"
name: ship-issue-skip-no-review
description: >-
  Implementing without a review is implement-issue's.
tags: [ship-issue]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Implement issue #12; no review needed.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: 'ship-issue"'
  min: 0
  max: 0
