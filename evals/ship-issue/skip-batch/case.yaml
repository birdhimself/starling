schema_version: "1.1"
name: ship-issue-skip-batch
description: >-
  Several issues at once are ship-issue-batch's.
tags: [ship-issue]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Ship issues #12 and #13 together.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: does-not-use-the-skill
  type: tool_used
  tool: Skill
  input_match: 'ship-issue"'
  min: 0
  max: 0
