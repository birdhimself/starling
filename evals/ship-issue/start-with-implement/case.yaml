schema_version: "1.1"
name: ship-issue-start-with-implement
description: >-
  Shipping an issue without GitHub stops before any code: nothing is
  implemented, reviewed or marked ready.
tags: [ship-issue]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Ship issue #12.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
runs: 3
graders:
- name: uses-the-skill
  type: tool_used
  tool: Skill
  input_match: 'ship-issue"'
- name: never-edits
  type: tool_used
  tool: Edit
  min: 0
  max: 0
- name: never-marks-ready
  type: tool_used
  tool: Bash
  input_match: 'gh pr ready'
  min: 0
  max: 0
